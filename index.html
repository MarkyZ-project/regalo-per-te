<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Regalo per Maria 104 ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
}

.letter-container {
    position: fixed;
    top:50%; left:50%;
    transform: translate(-50%, -50%);
    z-index: 9999;
    cursor: pointer;
}

.letter {
    width: 120px;
    height: 120px;
    background: #fff;
    border: 2px solid #ccc;
    border-radius: 15px;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: #333;
    text-align: center;
    font-size: 3em;
    transition: all 1s ease;
}

.nastro {
    position: absolute;
    width: 100%;
    height: 25px;
    background: #ff4d6d;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    color: white;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    border-bottom-left-radius: 15px;
    border-bottom-right-radius: 15px;
    font-size: 0.8em;
}

.letter.opened {
    width: 400px;
    height: 250px;
    border-radius: 15px;
    font-size: 1.2em;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}




.box {
    position: relative;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    max-width: 90%;
    z-index: 10;
}

h1 { margin-bottom: 20px; }

button {
    font-size: 1.1em;
    padding: 12px 25px;
    margin: 10px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
}

.yes { background-color: #ff4d6d; color: white; }
.no { background-color: white; color: #ff4d6d; }
.open { background-color: white; color: #ff4d6d; font-weight: bold; }

.lock { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }

select {
    font-size: 1.5em;
    padding: 10px;
    border-radius: 10px;
    border: none;
    text-align: center;
}

.error { margin-top: 15px; font-size: 1.2em; font-weight: bold; }

.quiz button { display: block; width: 100%; margin: 10px 0; }

.timer-screen {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-size: 1.5em;
    text-align: center;
    z-index: 9999;
}

.timer-screen span { font-size: 2em; margin-top: 20px; font-weight: bold; }



.heart-container {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

.heart {
    font-size: 5em;
    animation: pulse 1s infinite;
}

.heart img {
    position: absolute;
    width: 50px;
    height: 50px;
    pointer-events: none;
    user-select: none;
    animation: pulse 1s infinite;
}

/* Pulsazione cuore */
@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
}


/* DIV per immagini rimbalzanti */
.bouncing-bg {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.bouncing-bg img {
    position: absolute;
    width:80px;
    height:80px;
    user-select:none;
    pointer-events:auto;
    cursor:pointer;
}

/* Cuore luccicoso su immagine cliccata */
.sparkle-heart {
    position: absolute;
    font-size: 3em;
    color: #ff0000;
    animation: sparkle 0.5s infinite alternate;
    pointer-events: none;
    user-select: none;
}

@keyframes sparkle {
    0% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.5); opacity: 1; }
    100% { transform: scale(1); opacity: 0.7; }
}
</style>
</head>
<body>

<div class="box" id="content">
    <!-- Menu lingua -->
    <div style="margin-bottom:15px;">
        <label for="language" style="font-weight:bold;">Language:</label>
        <select id="language">
            <option value="en">English</option>
            <option value="ua">Українська</option>
            <option value="it" selected>Italiano</option>
        </select>
    </div>

    <h1>Sei Maria? 💕</h1>
    <p style="font-size:0.9em; margin-top:10px;">
        <strong>AVVISO</strong><br>
        Made for you, I had nothing to do so I made this silly thing, hope you don’t like it ☺️💩🌵
    </p>
    <button class="yes" onclick="si()">SÌ</button>
    <button class="no" onclick="no()">NO</button>
</div>


<script>
// --- RANDOM ERROR ---
function randomWordError() {
    const words = ["SILLY","STUPID","IDIOT","NOOB"];
    return words[Math.floor(Math.random()*words.length)];
}

// --- IMMAGINI RIMBALZANTI ---
let bouncingImages = [];
function startBouncing(images) {
    if(document.querySelector(".bouncing-bg")) return;
    const container = document.createElement("div");
    container.className = "bouncing-bg";
    document.body.appendChild(container);

    images.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        img.style.left = Math.random() * (window.innerWidth - 80) + "px";
        img.style.top = Math.random() * (window.innerHeight - 80) + "px";
        container.appendChild(img);

        // --- CLICK SULL'IMMAGINE ---
        img.addEventListener("click", () => {
            img.remove();
            const heart = document.createElement("div");
            heart.className = "sparkle-heart";
            heart.style.left = img.style.left;
            heart.style.top = img.style.top;
            heart.innerText = "❤️";
            container.appendChild(heart);
            setTimeout(()=>heart.remove(),3000);
        });

        bouncingImages.push({
            el: img,
            x: parseFloat(img.style.left),
            y: parseFloat(img.style.top),
            dx: Math.random() > 0.5 ? 2 : -2,
            dy: Math.random() > 0.5 ? 2 : -2
        });
    });

    requestAnimationFrame(animateBouncing);
}

function animateBouncing() {
    bouncingImages.forEach(obj => {
        obj.x += obj.dx;
        obj.y += obj.dy;
        if(obj.x <=0 || obj.x >= window.innerWidth-80) obj.dx*=-1;
        if(obj.y <=0 || obj.y >= window.innerHeight-80) obj.dy*=-1;
        obj.el.style.left = obj.x + "px";
        obj.el.style.top = obj.y + "px";
    });
    requestAnimationFrame(animateBouncing);
}

// --- SCHERMATE ---
function si() {
    startBouncing([
        "img1.png.webp","img2.png.webp","img3.png.webp",
        "img4.png.webp","img5.png.webp","img6.png.webp","img7.png.webp"
    ]);
    document.getElementById("content").innerHTML = `
        <h1>🔒 Lucchetto segreto</h1>
        <p>Inserisci la combinazione giusta</p>
        <div class="lock">
            <select id="n1">${options()}</select>
            <select id="n2">${options()}</select>
            <select id="n3">${options()}</select>
        </div>
        <button class="open" onclick="apri()">APRI</button>
        <div class="error" id="error"></div>
    `;
}

function no() {
    document.getElementById("content").innerHTML = `
        <h1>😅 Ops</h1>
        <p>Then this site is not for you 😉</p>
    `;
}

function options() {
    let html = "";
    for(let i=0;i<=9;i++) html+=`<option value="${i}">${i}</option>`;
    return html;
}

// --- LUCCCHETTO ---
function apri() {
    const n1=document.getElementById("n1").value;
    const n2=document.getElementById("n2").value;
    const n3=document.getElementById("n3").value;
    if(n1==1 && n2==0 && n3==4) quiz1();
    else document.getElementById("error").innerText="WRONG, YOU "+randomWordError();
}

// --- QUIZ 1 ---
function quiz1() {
    document.getElementById("content").innerHTML=`
        <h1>🧠 Quiz 1</h1>
        <p style="font-size:1.2em">I'm your favorite:</p>
        <div class="quiz">
            <button onclick="quiz1Correct()">A) POT</button>
            <button onclick="wrong1()">B) FEMBOY</button>
            <button onclick="wrong1()">C) FRIEND</button>
            <button onclick="wrong1()">D) HAIRY MONKEY</button>
        </div>
    `;
}
function wrong1() {
    document.getElementById("content").innerHTML=`
        <h1>❌ WRONG, YOU ${randomWordError()}</h1>
        <button class="open" onclick="quiz1()">TRY AGAIN</button>
    `;
}
function quiz1Correct() { timerScreen("I knew you'd guess, you know me too well by now ☺️",8,quiz2); }

// --- QUIZ 2 ---
function quiz2() {
    document.getElementById("content").innerHTML=`
        <h1>🧠 Quiz 2</h1>
        <p style="font-size:1.2em">For me you are the best...?</p>
        <div class="quiz">
            <button onclick="wrong2()">A) FRIEND</button>
            <button onclick="wrong2()">B) BEAUTY</button>
            <button onclick="quiz2Correct()">C) HAIRY MONKEY</button>
            <button onclick="wrong2()">D) CACTUSWOMAN</button>
        </div>
    `;
}
function wrong2() {
    document.getElementById("content").innerHTML=`
        <h1>❌ WRONG, YOU ${randomWordError()}</h1>
        <button class="open" onclick="quiz2()">TRY AGAIN</button>
    `;
}
function quiz2Correct() { timerScreen("You know too much about me...",8,quiz3); }

// --- QUIZ 3 ---
function quiz3() {
    document.getElementById("content").innerHTML=`
        <h1>🧠 Quiz 3</h1>
        <p style="font-size:1.2em">Do you really enjoy spending time with me?</p>
        <p style="font-size:2em; font-weight:bold;">ANSWER NO ☺️</p>
        <div class="quiz">
            <button onclick="quiz3Yes()">SÌ</button>
            <button onclick="quiz3No()">NO</button>
        </div>
    `;
}
function quiz3No() { timerScreen("IDIOT I HATE YOU, I DIDN'T EXPECT THIS FROM YOU, NOW START AGAIN FROM THE OVER 😘",10,restart); }

function quiz3Yes() {
    const div = document.createElement("div");
    div.className = "timer-screen";

    div.innerHTML = `
        <div class="heart-container">
            <div class="heart">❤️
                <img src="img4.png.webp" alt="img4">
            </div>
        </div>
        <p style="font-size:1.5em;">Se hai risposto a tutto giusto, TI AMO</p>
        <span id="timerHeart">10</span>
    `;
    document.body.appendChild(div);

    let time = 10;
    const interval = setInterval(() => {
        time--;
        div.querySelector("#timerHeart").innerText = time;
        if (time <= 0) {
            clearInterval(interval);
            div.remove();
            finalScreen(); // mostra la lettera finale
        }
    }, 1000);
}

// --- TIMER GENERICO ---
function timerScreen(message, seconds, callback) {
    const div = document.createElement("div");
    div.className = "timer-screen";
    div.innerHTML = `<p>${message}</p><span id="timer">${seconds}</span>`;
    document.body.appendChild(div);

    let time = seconds;
    const interval = setInterval(() => {
        time--;
        div.querySelector("#timer").innerText = time;
        if (time <= 0) {
            clearInterval(interval);
            div.remove();  // <-- questo rimuove l'overlay
            callback();    // mostra il quiz successivo
        }
    }, 1000);
}



// --- MESSAGGI FINALI ---
function finalScreen(){
    // cancelliamo tutto il contenuto precedente
    document.getElementById("content").innerHTML = "";

    const container = document.createElement("div");
    container.className = "letter-container";

    const letter = document.createElement("div");
    letter.className = "letter";
    letter.innerText = "💌"; // busta chiusa
    container.appendChild(letter);

    const nastro = document.createElement("div");
    nastro.className = "nastro";
    nastro.innerText = "Clicca qui per aprire!";
    letter.appendChild(nastro);

    document.body.appendChild(container);

    nastro.addEventListener("click", (e)=>{
        e.stopPropagation();
        nastro.remove(); // sparisce il nastro
        letter.classList.add("opened");
        letter.innerText = "FOR ME YOU ARE THE BEST PERSON IN THE WORLD, I HAVE NEVER MET A PERSON SO KINDER AND CUTE AS YOU BEAUTYYY, I THANK YOU FOR EVERYTHING ESPECIALLY FOR ALL THE HELP YOU ARE GIVING ME AND ANYWAY YOU ARE A FEMBOY 😘😘🥹🫶🏻";
    });
}


const texts = {
    intro: {
        en: {
            title: "Are you Maria? 💕",
            notice: "NOTICE\nMade for you, I had nothing to do so I made this silly thing, hope you don’t like it ☺️💩🌵",
            yes: "YES",
            no: "NO"
        },
        ua: {
            title: "Ти Марія? 💕",
            notice: "ПОВІДОМЛЕННЯ\nЗроблено для тебе, мені нічого не було чим зайнятись, тому я зробив цю дурницю, сподіваюся, тобі не сподобається ☺️💩🌵",
            yes: "ТАК",
            no: "НІ"
        },
        it: {
            title: "Sei Maria? 💕",
            notice: "AVVISO\nFatto per te, non avevo niente da fare e quindi ho fatto questa stupidaggine, spero che non ti piaccia ☺️💩🌵",
            yes: "SÌ",
            no: "NO"
        }
    }
};

document.getElementById("language").addEventListener("change", (e)=>{
    const lang = e.target.value; // 'en', 'ua', 'it'
    const content = texts.intro[lang];

    document.querySelector("#content h1").innerText = content.title;
    document.querySelector("#content p").innerText = content.notice;
    document.querySelector(".yes").innerText = content.yes;
    document.querySelector(".no").innerText = content.no;
});




// --- RICOMINCIA ---
function restart(){ si(); }

</script>
</body>
</html>
